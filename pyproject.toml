[project]
name = "pagouse"
description = "By ref, not by pixel: a Chromium page agent for coding agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gianluca Mazza", email = "info@gianlucamazza.it" }]
keywords = ["browser", "mcp", "computer-use", "accessibility"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dynamic = ["version"]
dependencies = ["websocket-client>=1.8,<2"]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3.0"]

[project.scripts]
pagouse = "pagouse.hosts.cli:main"
pagouse-mcp = "pagouse.hosts.mcp:main"
pagouse-browserd = "pagouse.browserd:main"

[project.urls]
Homepage = "https://github.com/gianlucamazza/pagouse"
Repository = "https://github.com/gianlucamazza/pagouse"
Issues = "https://github.com/gianlucamazza/pagouse/issues"
Changelog = "https://github.com/gianlucamazza/pagouse/blob/main/CHANGELOG.md"
Documentation = "https://github.com/gianlucamazza/pagouse/blob/main/docs/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pagouse/__init__.py"

[dependency-groups]
dev = ["ruff", "pytest", "ty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT"]
ignore = ["PT011", "PT017", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["pagouse"]

[tool.ty.src]
include = ["src"]
