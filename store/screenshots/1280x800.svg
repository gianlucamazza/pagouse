<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <!-- pagouse store screenshot: a real session, typeset -->
  <rect width="1280" height="800" fill="#0e1116"/>
  <rect x="60" y="48" width="1160" height="704" rx="14" fill="#161a20" stroke="#262c34" stroke-width="1.5"/>
  <circle cx="94" cy="70" r="7" fill="#ff5f56"/>
  <circle cx="122" cy="70" r="7" fill="#ffbd2e"/>
  <circle cx="150" cy="70" r="7" fill="#27c93f"/>
  <text x="640" y="76" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
        font-size="15" fill="#8b949e">pagouse</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="19">
    <!-- tabs command -->
    <text x="96" y="140"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3"> pagouse --json tabs</tspan></text>
    <text x="96" y="172" fill="#9aa4b2">active=1840 tabs=1</text>
    <text x="96" y="204" fill="#9aa4b2">&#160;&gt; #1840 https://example.com/login&#160;&#160;Sign in</text>

    <!-- snapshot command -->
    <text x="96" y="256"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3"> pagouse --json snapshot --tab 1840 | jq -r '.snapshot.tree'</tspan></text>
    <text x="96" y="288" fill="#9aa4b2">RootWebArea "Sign in" <tspan fill="#79c0ff">[ref_1]</tspan></text>
    <text x="96" y="320" fill="#9aa4b2">&#160;&#160;textbox "Email" <tspan fill="#79c0ff">[ref_2]</tspan> type=email placeholder=you@example.com</text>
    <text x="96" y="352" fill="#9aa4b2">&#160;&#160;textbox "Password" <tspan fill="#79c0ff">[ref_3]</tspan> type=password [redacted]</text>
    <text x="96" y="384" fill="#9aa4b2">&#160;&#160;button "Sign in" <tspan fill="#79c0ff">[ref_4]</tspan></text>
    <text x="96" y="416" fill="#9aa4b2">&#160;&#160;link "Forgot password?" <tspan fill="#79c0ff">[ref_5]</tspan> href=/reset</text>

    <!-- fill command -->
    <text x="96" y="468"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3"> pagouse --json --allow-input fill --ref ref_2 \</tspan></text>
    <text x="120" y="500" fill="#e6edf3">--value "ada@example.com" --tab 1840 --then snapshot</text>
    <text x="96" y="552" fill="#9aa4b2">{</text>
    <text x="120" y="584" fill="#9aa4b2">"ok": true, "schema": 1, "action": "fill",</text>
    <text x="120" y="616" fill="#9aa4b2">"tab_id": 1840, "ref": <tspan fill="#79c0ff">"ref_2"</tspan>, "filled": true</text>
    <text x="96" y="648" fill="#9aa4b2">}</text>

    <!-- caption strip -->
    <text x="96" y="712" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#6e7681">observe by default &#183; click and fill by ref, never by pixel &#183; local daemon, no cloud</text>
  </g>
</svg>
